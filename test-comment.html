<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Formulaire Commentaire</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Test Formulaire Commentaire</h1>
    
    <form id="commentForm">
        <div class="form-group">
            <label for="nomComplet">Nom complet *</label>
            <input type="text" id="nomComplet" name="nomComplet" required placeholder="Votre nom complet">
        </div>
        
        <div class="form-group">
            <label for="commentaire">Commentaire *</label>
            <textarea id="commentaire" name="commentaire" required rows="4" placeholder="Votre commentaire ou remarque..."></textarea>
        </div>
        
        <button type="submit">Envoyer le commentaire</button>
    </form>
    
    <div id="message"></div>

    <script>
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                nomComplet: document.getElementById('nomComplet').value,
                commentaire: document.getElementById('commentaire').value,
                personne: 'test-person-id',
                datePublication: new Date().toISOString()
            };
            
            try {
                const response = await fetch('/.netlify/functions/add-comment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showMessage('Commentaire envoyé avec succès !', 'success');
                    document.getElementById('commentForm').reset();
                } else {
                    const error = await response.text();
                    showMessage(`Erreur: ${error}`, 'error');
                }
            } catch (error) {
                showMessage(`Erreur de connexion: ${error.message}`, 'error');
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
